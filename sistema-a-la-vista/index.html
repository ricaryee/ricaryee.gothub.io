:root{
  --n950:#081433; --n900:#0B1A3F; --n800:#12285E; --n700:#1B3C8C; --n600:#2A4FA8; --b500:#3F6CC4; --b300:#9DB4E4; --b100:#E6ECF8; --b50:#F3F6FC;
  --yel:#F5C44E; --yel-ink:#7A5A00; --yel-100:#FDF3D7;
  --red:#D6383E; --red-ink:#A3242A; --red-100:#FBEDEE;
  --grn:#2F8F5B; --grn-ink:#1F6B42; --grn-100:#E5F3EB;
  --org:#E8742A; --org-100:#FCEBDD;
  --amb:#E0A800; --amb-100:#FBF1D2;
  --ink:#1A2233; --ink2:#465068; --mute:#7A8599; --line:#DDE3EE; --line2:#EBEFF6;
  --bg:#EEF1F7; --card:#FFFFFF;
  --r:14px; --sh:0 1px 2px rgba(18,40,94,.06),0 4px 14px rgba(18,40,94,.06);
  --mont:'Mont',system-ui,sans-serif; --inter:'Inter',system-ui,sans-serif; --mono:'Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--inter);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1,'cv11' 1}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--n700)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}

/* ---------- banner ---------- */
.demo{position:fixed;top:0;left:0;right:0;height:30px;z-index:50;display:flex;align-items:center;justify-content:center;gap:14px;
  background:repeating-linear-gradient(-45deg,#F5C44E 0 14px,#F2BA35 14px 28px);color:#3A2B00;font:700 11.5px/1 var(--mont);letter-spacing:.09em;text-transform:uppercase}
.demo span{background:#1A2233;color:#F5C44E;padding:4px 9px;border-radius:4px}
.demo em{font-style:normal;font-family:var(--inter);font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh;padding-top:30px}
.side{position:fixed;top:30px;bottom:0;left:0;width:262px;background:linear-gradient(180deg,var(--n900),var(--n950));color:#C9D3EA;display:flex;flex-direction:column;z-index:20}
.flag{height:5px;display:flex}.flag i{display:block;height:100%}.flag i:nth-child(1){flex:2;background:var(--yel)}.flag i:nth-child(2){flex:1;background:#1B3C8C}.flag i:nth-child(3){flex:1;background:var(--red)}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 14px}
.brand .chip{width:58px;height:46px;background:#fff;border-radius:9px;display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.brand .chip img{width:50px}
.brand b{display:block;font:800 15px/1.15 var(--mont);color:#fff;letter-spacing:.01em}
.brand small{display:block;font-size:11.5px;color:#93A3C9;margin-top:3px}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav h6{margin:16px 10px 6px;font:700 10.5px/1 var(--mont);letter-spacing:.14em;color:#6F81AE;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:#C9D3EA;text-decoration:none;font-weight:500;font-size:13.5px;position:relative}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(63,108,196,.35),rgba(63,108,196,.12));color:#fff}
.nav a.on:before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--yel)}
.nav a .cnt{margin-left:auto;background:var(--red);color:#fff;font:700 10.5px/1 var(--inter);padding:3px 6px;border-radius:10px}
.nav a .cnt.y{background:var(--yel);color:#3A2B00}
.sfoot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#8D9CC2}
.sfoot .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sfoot .av{width:32px;height:32px;border-radius:50%;background:var(--b500);color:#fff;display:grid;place-items:center;font:700 12px var(--mont)}
.sfoot b{color:#fff;font-weight:600;display:block;font-size:12.5px}
.seal{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:8px 10px;line-height:1.35}
.seal svg{flex:none;margin-top:1px}

.main{grid-column:2;min-width:0}
.top{position:sticky;top:30px;z-index:10;height:66px;display:flex;align-items:center;gap:18px;padding:0 28px;background:rgba(238,241,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .crumb{font-size:12px;color:var(--mute);font-weight:500}
.top h1{margin:1px 0 0;font:800 20px/1.1 var(--mont);color:var(--n800);letter-spacing:-.01em}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px;width:360px;color:var(--mute)}
.search input{border:0;outline:0;flex:1;background:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--grn)}
.view{padding:22px 28px 40px}

/* ---------- primitives ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;min-width:0}
.card.tight{padding:14px 16px}
.card h3{margin:0 0 3px;font:800 15.5px/1.25 var(--mont);color:var(--n800)}
.card .sub{margin:0 0 12px;color:var(--mute);font-size:12.5px;line-height:1.4}
.kick{font:700 10.5px/1 var(--mont);letter-spacing:.13em;text-transform:uppercase;color:var(--red)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:12px}
.hrow h3{margin:0}
.lede{display:flex;gap:22px;align-items:stretch;margin-bottom:18px}
.lede .txt{flex:1}
.lede .txt h2{margin:6px 0 6px;font:800 25px/1.18 var(--mont);color:var(--n800);letter-spacing:-.015em;max-width:980px}
.lede .txt p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5;max-width:900px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--b100);color:var(--n700);white-space:nowrap}
.tag.g{background:var(--grn-100);color:var(--grn-ink)}.tag.r{background:var(--red-100);color:var(--red-ink)}.tag.y{background:var(--amb-100);color:var(--yel-ink)}.tag.o{background:var(--org-100);color:#9A4710}.tag.k{background:#EEF0F4;color:var(--ink2)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;white-space:nowrap}
.st i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:800}
.st.v{color:var(--grn-ink)}.st.v i{background:var(--grn)}
.st.a{color:var(--yel-ink)}.st.a i{background:var(--amb);color:#2B2000}
.st.r{color:var(--red-ink)}.st.r i{background:var(--red)}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--n800);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--b300)}
.btn.p{background:var(--n700);border-color:var(--n700);color:#fff}.btn.p:hover{background:var(--n600)}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--b50)}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.big{font:800 30px/1 var(--mont);letter-spacing:-.02em;color:var(--n800)}
.muted{color:var(--mute)}
.note{font-size:12px;color:var(--mute);line-height:1.45}
.sep{height:1px;background:var(--line2);margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prog{height:8px;border-radius:5px;background:#E7EBF3;overflow:hidden}
.prog b{display:block;height:100%;border-radius:5px;background:var(--n700)}
.tip{position:fixed;pointer-events:none;z-index:80;background:#0B1A3F;color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:260px;display:none}
.tip b{font-weight:700}
.toast{position:fixed;right:24px;bottom:24px;z-index:90;background:#0B1A3F;color:#fff;border-radius:12px;padding:13px 16px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;line-height:1.45;transform:translateY(20px);opacity:0;transition:.25s}
.toast.on{transform:none;opacity:1}
.toast b{color:var(--yel)}

/* ---------- tablero ---------- */
.hero{background:linear-gradient(120deg,var(--n800),var(--n700) 60%,#2C55B5);color:#fff;border-radius:18px;padding:20px 24px;display:grid;grid-template-columns:1.25fr repeat(4,1fr);gap:18px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(18,40,94,.25);margin-bottom:16px}
.hero:after{content:'';position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(245,196,78,.22),transparent 65%)}
.hero .hk{font:700 10.5px/1 var(--mont);letter-spacing:.14em;color:var(--yel);text-transform:uppercase}
.hero h2{margin:8px 0 6px;font:800 22px/1.15 var(--mont)}
.hero p{margin:0;color:#C9D3EA;font-size:12.5px;line-height:1.45}
.hero .kp{border-left:1px solid rgba(255,255,255,.16);padding-left:18px;position:relative;z-index:1}
.hero .kp small{display:block;color:#AFC0E6;font-size:11.5px;font-weight:600;margin-bottom:8px}
.hero .kp b{display:block;font:800 27px/1 var(--mont);letter-spacing:-.02em}
.hero .kp span{display:block;margin-top:7px;color:#C9D3EA;font-size:11.5px}
.kpi{position:relative;padding:14px 16px 12px;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--c,#1B3C8C)}
.kpi .kh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi h4{margin:2px 0 2px;font:700 13.5px/1.25 var(--mont);color:var(--ink)}
.kpi .def{font-size:11.5px;color:var(--mute)}
.kpi .val{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px;gap:8px}
.kpi .val b{font:800 26px/1 var(--mont);letter-spacing:-.02em;color:var(--n800)}
.kpi .val b small{font-size:14px;font-weight:700}
.kpi .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:10px;font-size:11.5px;color:var(--ink2)}
.kpi .meta span:nth-child(odd){color:var(--mute)}
.kpi .src{margin-top:8px;font-size:11px;color:var(--mute);border-top:1px solid var(--line2);padding-top:7px}
.cats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.cats span{display:inline-flex;align-items:center;gap:6px}.cats i{width:12px;height:12px;border-radius:3px}
.feed .it{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:start}
.feed .it:last-child{border-bottom:0}
.feed .rn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 12px var(--mont);color:#fff;background:var(--n700)}
.feed .it b{font-weight:600;font-size:13px}
.feed .it p{margin:2px 0 0;font-size:12px;color:var(--mute);line-height:1.4}
.ladder{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.ladder .lv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.ladder .lv .bar{width:100%;border-radius:8px 8px 4px 4px;background:var(--n700);color:#fff;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;font:800 17px var(--mont);min-height:36px}
.ladder .lv small{font-size:11px;color:var(--mute);text-align:center;line-height:1.25}

/* map */
.map svg{width:100%;height:auto;display:block}
.map .mun{stroke:#fff;stroke-width:.6;cursor:pointer;transition:opacity .15s}
.map .mun:hover{opacity:.75;stroke:#0B1A3F;stroke-width:1.2}
.map .dep{fill:#F1F3F7;stroke:#CBD2DE;stroke-width:.7}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- viaje ---------- */
.idbar{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--sh);margin-bottom:16px}
.idbar .id{font:700 19px var(--mono);color:var(--n800);letter-spacing:-.02em}
.idbar .nm{font-weight:600;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:0;position:relative;margin:6px 0 4px}
.step{position:relative;padding:0 8px;text-align:center;cursor:pointer}
.step:before{content:'';position:absolute;top:21px;left:-50%;right:50%;height:4px;background:var(--grn);z-index:0}
.step:first-child:before{display:none}
.step.wait:before{background:#D5DBE6}
.step .dot{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;font:800 16px var(--mont);color:#fff;background:var(--grn);box-shadow:0 0 0 5px #fff,0 0 0 6px var(--line)}
.step.now .dot{background:var(--n700);box-shadow:0 0 0 5px #fff,0 0 0 7px var(--yel)}
.step.wait .dot{background:#fff;color:var(--mute);border:2px dashed #B9C2D3}
.step.sel .dot{transform:scale(1.08)}
.step b{display:block;font:700 13px var(--mont);color:var(--n800)}
.step small{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.3}
.gate{border-radius:16px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#1F6B42,#2F8F5B);box-shadow:0 10px 26px rgba(47,143,91,.28);position:relative;overflow:hidden}
.gate.no{background:linear-gradient(135deg,#A3242A,#D6383E);box-shadow:0 10px 26px rgba(214,56,62,.28)}
.gate .gk{font:700 10.5px/1 var(--mont);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.gate .gv{font:800 34px/1 var(--mont);margin:8px 0 6px;letter-spacing:-.01em}
.gate p{margin:0;font-size:12.5px;line-height:1.45;opacity:.92}
.cond{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px}
.cond:last-child{border-bottom:0}
.cond .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;background:var(--grn)}
.cond.bad .ck{background:var(--red)}
.sw{position:relative;width:38px;height:22px;border-radius:11px;background:#D5DBE6;border:0;flex:none;transition:.2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--red)}.sw.on:after{left:19px}
.chain{display:flex;flex-direction:column;gap:0}
.blk{display:grid;grid-template-columns:44px 1fr;gap:12px;position:relative}
.blk .ln{display:flex;flex-direction:column;align-items:center}
.blk .ln i{width:30px;height:30px;border-radius:8px;background:var(--b100);color:var(--n700);display:grid;place-items:center;font:800 11.5px var(--mont);font-style:normal;flex:none}
.blk .ln:after{content:'';flex:1;width:2px;background:var(--line);margin:3px 0}
.blk:last-child .ln:after{display:none}
.blk .bd{padding:3px 0 14px;min-width:0}
.blk .bd .h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.blk .bd .h b{font-weight:600}
.blk .bd .hs{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:4px;word-break:break-all;line-height:1.45}
.blk .bd .hs em{font-style:normal;color:var(--n700)}
.blk.bad .ln i{background:var(--red);color:#fff}
.blk.bad .bd .hs em{color:var(--red);text-decoration:line-through}
.blk.ok .ln i{background:var(--grn-100);color:var(--grn-ink)}
.vbanner{border-radius:12px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.vbanner.ok{background:var(--grn-100);color:var(--grn-ink)}.vbanner.bad{background:var(--red-100);color:var(--red-ink)}.vbanner.idle{background:var(--b50);color:var(--n700)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
.kv span{color:var(--mute)}
.kv b{font-weight:600}

/* ---------- reglas ---------- */
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rule{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;cursor:pointer;position:relative;transition:.15s;box-shadow:var(--sh)}
.rule:hover{border-color:var(--b300);transform:translateY(-1px)}
.rule.sel{border-color:var(--n700);box-shadow:0 0 0 3px rgba(27,60,140,.14)}
.rule .rh{display:flex;align-items:center;gap:10px}
.rule .num{width:32px;height:32px;border-radius:9px;background:var(--n700);color:#fff;display:grid;place-items:center;font:800 14px var(--mont);flex:none}
.rule.lock .num{background:var(--red)}
.rule b{font:700 13.5px/1.2 var(--mont);color:var(--n800)}
.rule .when{font-size:11.5px;color:var(--mute);margin-top:2px}
.rule .nums{display:flex;gap:12px;margin-top:11px;font-size:11.5px;color:var(--mute)}
.rule .nums strong{display:block;font:800 18px/1 var(--mont);color:var(--ink);margin-bottom:3px}
.rule .live{position:absolute;right:12px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(214,56,62,.15)}
.lab{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fld label{font-size:12px;color:var(--ink2);font-weight:600}
.fld input[type=number],.fld input[type=text],.fld select,.fld textarea{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;outline:none}
.fld textarea{height:64px;padding:8px 10px;resize:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--b500);box-shadow:0 0 0 3px rgba(63,108,196,.15)}
.fld input[type=range]{width:100%;accent-color:var(--n700)}
.out{border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.45;margin-top:6px}
.out.ok{background:var(--grn-100);color:var(--grn-ink)}.out.bad{background:var(--red-100);color:var(--red-ink)}.out.warn{background:var(--amb-100);color:var(--yel-ink)}
.out b{font-weight:700}

/* ---------- banderas ---------- */
.flags{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.flg{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 10px 9px;box-shadow:var(--sh)}
.flg strong{font:800 22px/1 var(--mont);color:var(--n800)}
.flg>span{display:block;font-size:11px;color:var(--ink2);line-height:1.3;margin-top:6px;min-height:43px}
.flg .mini{height:4px;border-radius:2px;background:#E7EBF3;margin-top:6px;overflow:hidden}.flg .mini b{display:block;height:100%;background:var(--red)}
.clock{font:700 13px var(--mono);color:var(--n800)}
.clock.low{color:var(--red)}
.ring{width:44px;height:44px;flex:none}

/* ---------- bloqueos ---------- */
.stair{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:250px}
.stair .s{border-radius:12px 12px 6px 6px;background:var(--n700);color:#fff;padding:12px 13px;display:flex;flex-direction:column;position:relative}
.stair .s:last-child{background:var(--red)}
.stair .s b{font:800 13.5px var(--mont)}
.stair .s em{font-style:normal;color:var(--yel);font-weight:700;font-size:12px;margin-left:auto}
.stair .s p{margin:5px 0 0;font-size:11.5px;color:#D7E0F4;line-height:1.35}
.stair .s .c{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px;padding-top:8px}
.stair .s .c i{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700}
.stair .s .c i.hot{background:var(--yel);color:#3A2B00}
.axis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px;font-size:11.5px;color:var(--mute);text-align:right;font-weight:600}
.axis span:last-child{color:var(--red)}
.lvl{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--n700);color:#fff;font:800 12px var(--mont)}
.lvl.l5{background:var(--red)}
.daybar{display:flex;gap:2px}.daybar i{width:9px;height:14px;border-radius:2px;background:#E3E8F1}.daybar i.f{background:var(--n700)}.daybar i.w{background:var(--amb)}.daybar i.x{background:var(--red)}

/* ---------- evidencia / phones ---------- */
.phone{width:330px;height:676px;border-radius:46px;background:#0E1424;padding:12px;box-shadow:0 30px 60px rgba(11,26,63,.35),inset 0 0 0 2px #2A3550;position:relative;flex:none}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#F4F6FA;position:relative;display:flex;flex-direction:column}
.phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:0 0 16px 16px;background:#0E1424;z-index:3}
.phone .sb{height:40px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font-size:12px;font-weight:700;color:#fff;flex:none}
.app-h{background:var(--n800);color:#fff;padding:0 0 12px}
.app-h .t{padding:6px 16px 0;font:800 15px var(--mont)}
.app-h .s{padding:3px 16px 0;font-size:11.5px;color:#AFC0E6}
.offl{margin:10px 14px 0;background:var(--yel);color:#3A2B00;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.pbody{flex:1;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pcard{background:#fff;border-radius:13px;padding:11px 12px;border:1px solid var(--line);font-size:12px}
.pcard .lb{font-size:10.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pcard .vl{font-weight:600;margin-top:3px;font-size:12.5px}
.photo{height:170px;border-radius:11px;overflow:hidden;position:relative}
.photo svg{width:100%;height:100%;display:block}
.photo .stamp{position:absolute;left:8px;bottom:8px;right:8px;background:rgba(11,26,63,.82);color:#fff;border-radius:8px;padding:6px 8px;font:600 10px/1.4 var(--mono)}
.pbtn{height:42px;border-radius:11px;background:var(--n700);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;border:0;width:100%}
.geo svg{width:100%;height:auto;display:block;border-radius:10px}
.sat{position:relative;border-radius:12px;overflow:hidden;height:330px;user-select:none}
.sat canvas{position:absolute;inset:0;width:100%;height:100%}
.sat .aft{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}
.sat .hand{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.4);cursor:ew-resize}
.sat .hand:after{content:'⟷';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;color:var(--n800);display:grid;place-items:center;font-size:16px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sat .lb{position:absolute;top:10px;padding:4px 9px;border-radius:6px;background:rgba(11,26,63,.8);color:#fff;font-size:11.5px;font-weight:600}
.sat .poly{position:absolute;inset:0;pointer-events:none}

/* ---------- portal ---------- */
.portal{background:#fff;border-radius:20px;border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh)}
.ph{background:radial-gradient(1200px 400px at 85% -10%,rgba(245,196,78,.25),transparent 60%),linear-gradient(120deg,#0B1A3F,#1B3C8C);color:#fff;padding:30px 34px 28px;position:relative}
.ph .pk{font:700 11px/1 var(--mont);letter-spacing:.16em;color:var(--yel);text-transform:uppercase}
.ph h2{margin:10px 0 6px;font:800 40px/1.05 var(--mont);letter-spacing:-.02em}
.ph p{margin:0;color:#C9D3EA;font-size:15px;max-width:720px;line-height:1.5}
.psearch{margin-top:18px;display:flex;gap:10px;max-width:780px}
.psearch div{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;height:50px;padding:0 16px;color:var(--mute)}
.psearch input{border:0;outline:0;flex:1;font-size:15px;color:var(--ink)}
.psearch button{height:50px;border-radius:12px;border:0;background:var(--yel);color:#2B2000;font-weight:800;padding:0 22px;font-family:var(--mont)}
.pnums{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.pnums div{padding:18px 24px;border-right:1px solid var(--line)}
.pnums div:last-child{border-right:0}
.pnums small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.pnums b{display:block;font:800 28px/1.1 var(--mont);color:var(--n800);margin-top:5px;letter-spacing:-.02em}
.pnums span{font-size:12px;color:var(--ink2)}
.psec{padding:22px 28px;border-bottom:1px solid var(--line)}
.psec h3{margin:0 0 4px;font:800 18px var(--mont);color:var(--n800)}
.stamp-sr{display:inline-block;transform:rotate(-4deg);border:2px solid var(--red);color:var(--red);font:800 11px var(--mont);letter-spacing:.08em;padding:3px 7px;border-radius:5px;text-transform:uppercase}
.don{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:0;font-size:13px}
.don>div{padding:10px 12px;border-bottom:1px solid var(--line2)}
.don .h{font-size:11.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ---------- chat ---------- */
.chat{flex:1;overflow:hidden;padding:12px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;background:#E9EEF6}
.msg{max-width:84%;padding:7px 10px 5px;border-radius:12px;font-size:12px;flex:none;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg.u{align-self:flex-end;background:#D6E4FF;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.msg .src{display:block;margin-top:5px;padding-top:5px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--n700);font-weight:600}
.msg time{display:block;text-align:right;font-size:10px;color:var(--mute);margin-top:2px}
.msg.sys{align-self:center;background:var(--yel-100);color:var(--yel-ink);font-size:11px;font-weight:600;max-width:92%;text-align:center}
.chat-in{display:flex;gap:8px;padding:9px 10px 14px;background:#F4F6FA}
.chat-in div{flex:1;height:38px;border-radius:19px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;padding:0 14px;color:var(--mute);font-size:12.5px}
.chat-in i{width:38px;height:38px;border-radius:50%;background:var(--n700);flex:none;display:grid;place-items:center}

/* ---------- arquitectura ---------- */
.arch{display:grid;grid-template-columns:1fr 70px 1.35fr 70px 1fr;gap:0;align-items:stretch}
.arch .col{display:flex;flex-direction:column;gap:8px}
.arch .src,.arch .usr{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.arch .src:hover,.arch .usr:hover,.arch .core>div:hover{border-color:var(--b500)}
.arch .src b,.arch .usr b{display:block;font-weight:700;font-size:13px;color:var(--n800)}
.arch .src small,.arch .usr small{font-size:11.5px;color:var(--mute)}
.arch .pipe{display:flex;align-items:center;justify-content:center;position:relative}
.arch .pipe .bar{position:absolute;top:0;bottom:0;width:46px;border-radius:12px;background:var(--b100);border:1px dashed var(--b300)}
.arch .pipe span{position:relative;writing-mode:vertical-rl;transform:rotate(180deg);font:700 11.5px var(--mont);color:var(--n700);letter-spacing:.04em}
.arch .core{background:linear-gradient(180deg,#0F2152,#12285E);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 34px rgba(18,40,94,.3)}
.arch .core .ct{font:700 10.5px var(--mont);letter-spacing:.14em;color:var(--yel);text-transform:uppercase;text-align:center;padding:2px 0 2px}
.arch .core>div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;color:#fff;cursor:pointer;transition:.15s}
.arch .core>div.main{background:linear-gradient(135deg,rgba(245,196,78,.22),rgba(245,196,78,.08));border-color:rgba(245,196,78,.55)}
.arch .core>div b{font:800 14.5px var(--mont)}
.arch .core>div p{margin:4px 0 0;font-size:12px;color:#C9D3EA;line-height:1.4}
.arch .secbar{grid-column:1/-1;margin-top:14px;background:var(--n800);color:#fff;border-radius:12px;padding:11px 16px;font-size:12.5px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.arch .secbar b{color:var(--yel);font-family:var(--mont)}
.archsel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}

/* ---------- seguridad ---------- */
.sod{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sod .r{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.sod .r b{font:700 13.5px var(--mont);color:var(--n800)}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.6;background:#0B1A3F;color:#C9D3EA;border-radius:12px;padding:12px 14px;max-height:260px;overflow:auto}
.log .w{color:var(--yel)}.log .e{color:#FF8A8E}.log .o{color:#7FD3A4}

/* scroll */
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
@media (max-width:1280px){.g4{grid-template-columns:repeat(2,1fr)}.rules{grid-template-columns:repeat(3,1fr)}.flags{grid-template-columns:repeat(5,1fr)}}

.grid>*{min-width:0}
.btn{white-space:nowrap}
.fld input[type=number],.fld input[type=text],.fld select{width:100%;min-width:0}
.rule .nums div:last-child strong{font-size:14px;line-height:18px}
@media (max-width:1440px){.hero{grid-template-columns:1.15fr repeat(4,1fr);gap:14px;padding:18px 20px}.hero .kp b{font-size:22px}.hero h2{font-size:19px}.lede .txt h2{font-size:22px}}

function spark(k, w = 120, h = 38) {

  const n = 22, pts = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const base = k.start + (k.sim - k.start) * (1 - Math.pow(1 - t, 1.6));
    const noise = (R() - 0.5) * Math.abs(k.sim - k.start) * 0.08 * (1 - t);
    pts.push(i === n - 1 ? k.sim : base + noise);
  }
  const lo = Math.min(...pts, k.hito ?? pts[0]), hi = Math.max(...pts, k.hito ?? pts[0]), sp = hi - lo || 1;
  const X = i => 2 + i * (w - 6) / (n - 1), Y = v => h - 4 - (v - lo) / sp * (h - 8);
  const d = pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const hl = k.hito != null ? `<line x1="2" x2="${w - 2}" y1="${Y(k.hito).toFixed(1)}" y2="${Y(k.hito).toFixed(1)}" stroke="#9AA6BC" stroke-dasharray="3 3" stroke-width="1"/>` : '';

let CH = null; // estado de la cadena
function chainInit() {
  const ev = EVENTOS.map(e => ({ ts: e[0], ty: e[1], ac: e[2], da: e[3] }));
  let prev = '0'.repeat(64);
  ev.forEach(e => { e.prev = prev; e.h = sha256([prev, e.ts, e.ty, e.ac, e.da].join('|')); prev = e.h; });
  CH = { ev, seal: prev, tampered: false, verified: null };
}
function chainVerify() {
  let prev = '0'.repeat(64), firstBad = -1;
  CH.ev.forEach((e, i) => {
    const h = sha256([prev, e.ts, e.ty, e.ac, e.da].join('|'));
    e.calc = h; e.ok = h === e.h;
    if (!e.ok && firstBad < 0) firstBad = i;
    prev = h; // se encadena con la huella recalculada: un cambio arrastra a todas las siguientes
  });
  CH.verified = { firstBad, sealOk: CH.ev[CH.ev.length - 1].calc === CH.seal };
}
const short = h => h.slice(0, 18) + '…' + h.slice(-8);

function pvCurve(total, W, wk, at) { // S-curve with PV(wk)=at
  const target = at / total;
  let lo = 0.5, hi = 3; // p such that smoothstep((wk/W)^p) = target
  const ss = x => 3 * x * x - 2 * x * x * x;
  for (let k = 0; k < 60; k++) { const p = (lo + hi) / 2; ss(Math.pow(wk / W, p)) > target ? lo = p : hi = p; }
  const p = (lo + hi) / 2;
  return t => total * ss(Math.pow(Math.min(t, W) / W, p));
}
function evCurves(i) {
  const P = PROY[i], W = 40, wk = 20, total = P.val;
  const pv = pvCurve(total, W, wk, i === 1 ? 4000 : total * 0.4);
  const pv20 = pv(wk), ev20 = i === 1 ? 3400 : pv20 * P.spi, ac20 = i === 1 ? 3600 : ev20 / P.cpi;
  const evf = t => pv(t) * (1 - (1 - ev20 / pv20) * Math.pow(t / wk, 1.4));
  const acf = t => { const base = evf(t) * (1 + (ac20 / ev20 - 1) * Math.pow(t / wk, 0.8)); const ant = t >= 1 ? total * 0.1 : total * 0.1 * t; return Math.max(base, ant); };
  return { total, pv, pv20, ev20, ac20, evf, acf, W, wk };
}

function sankey() {
  const w = 900, h = 380, nw = 14, X0 = 200, X1 = w - 240, gap = 12;
  const tot = FUENTES.reduce((a, f) => a + f[1], 0), sc = (h - gap * (USOS.length - 1)) / tot;
  const pos = (arr, g) => { let y = 0; return arr.map(a => { const o = { y, h: a[1] * sc }; y += a[1] * sc + g; return o; }); };
  const gS = (h - tot * sc) / (FUENTES.length - 1);
  const S = pos(FUENTES, gS), U = pos(USOS, gap);
  // etiquetas sin choques: separación mínima de 34 px
  const place = nodes => { const ys = nodes.map(n => n.y + n.h / 2); for (let i = 1; i < ys.length; i++) ys[i] = Math.max(ys[i], ys[i - 1] + 34); const over = ys[ys.length - 1] - (h - 18); if (over > 0) { ys[ys.length - 1] -= over; for (let i = ys.length - 2; i >= 0; i--) ys[i] = Math.min(ys[i], ys[i + 1] - 34); } return ys; };
  const lS = place(S), lU = place(U);
  const so = S.map(s => s.y), uo = U.map(u => u.y);
  const COL = ['#1B3C8C', '#3F6CC4', '#2F8F5B', '#E8742A', '#E0A800'];
  const links = FLUJOS.map(([a, b, v]) => {
    const t = v * sc, y0 = so[a] + t / 2, y1 = uo[b] + t / 2; so[a] += t; uo[b] += t;
    const xm = (X0 + nw + X1) / 2;
    return `<path d="M${X0 + nw} ${y0}C${xm} ${y0} ${xm} ${y1} ${X1} ${y1}" fill="none" stroke="${COL[a]}" stroke-opacity=".3" stroke-width="${Math.max(1, t)}" data-t="<b>${FUENTES[a][0]} → ${USOS[b][0]}</b><br>${mm(v)}"/>`;
  }).join('');
  const lead = (x0, x1, yN, yL) => Math.abs(yN - yL) > 3 ? `<path d="M${x0} ${yN}L${(x0 + x1) / 2} ${yN}L${x1} ${yL}" fill="none" stroke="#B9C2D3" stroke-width="1"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h + 4}" style="width:100%;height:auto;font-family:Inter">${links}
    ${S.map((s, i) => `<rect x="${X0}" y="${s.y}" width="${nw}" height="${Math.max(2, s.h)}" rx="3" fill="${COL[i]}"/>${lead(X0 - 2, X0 - 16, s.y + s.h / 2, lS[i])}<text x="${X0 - 20}" y="${lS[i] - 3}" text-anchor="end" font-size="13" font-weight="700" fill="#1A2233">${FUENTES[i][0]}</text><text x="${X0 - 20}" y="${lS[i] + 13}" text-anchor="end" font-size="12" fill="#7A8599">${mm(FUENTES[i][1])}</text>`).join('')}
    ${U.map((u, i) => `<rect x="${X1}" y="${u.y}" width="${nw}" height="${Math.max(2, u.h)}" rx="3" fill="#12285E"/>${lead(X1 + nw + 2, X1 + nw + 16, u.y + u.h / 2, lU[i])}<text x="${X1 + nw + 20}" y="${lU[i] - 3}" font-size="13" font-weight="700" fill="#1A2233">${USOS[i][0]}</text><text x="${X1 + nw + 20}" y="${lU[i] + 13}" font-size="12" fill="#7A8599">${mm(USOS[i][1])}</text>`).join('')}</svg>`;
}
function alertRows(list) {

let LAST = null;
function runTests() {
  const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:-20000px;top:0;width:1600px'; document.body.appendChild(box);
  const t0 = performance.now();
  const res = TESTS.map(t => {
    let ok = false, exp = '', got = '';
    try { const r = t.f(box); exp = r[0]; got = r[1]; ok = String(r[0]) === String(r[1]); if (r[0] === true) { exp = 'sí'; got = r[1] ? 'sí' : 'no'; } }
    catch (e) { got = 'error: ' + e.message; }
    return { v: t.v, n: t.n, exp: String(exp), got: String(got), ok };
  });
  box.remove(); chainInit(); tipOff();
  $('#toast').classList.remove('on');
  LAST = { res, ms: Math.round(performance.now() - t0), at: new Date() };
  window.__PRUEBAS = LAST;
  return LAST;
}

VIEWS.pruebas = el => {
  const draw = () => {
    const { res, ms, at } = runTests();
    const ok = res.filter(r => r.ok).length;
    el.innerHTML = `
    <div class="lede"><div class="txt"><div class="kick">El prototipo se revisa a sí mismo</div><h2>${ok} de ${res.length} pruebas aprobadas</h2>
      <p>Cada prueba ejecuta en este navegador la lógica de una vista (reglas, plazos, huellas, bandas, curvas y permisos) o la dibuja y la opera como lo haría una persona. Prueban el diseño; la integración con los sistemas reales se prueba con la prueba de aceptación de cada ficha.</p></div>
      <div class="card tight" style="min-width:330px;display:flex;flex-direction:column;justify-content:center;gap:10px">
        <div class="spread"><div><div class="note">Última ejecución</div><b style="font:800 15px var(--mont);color:var(--n800)">${at.toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'medium' })}</b></div><span class="st ${ok === res.length ? 'v' : 'r'}"><i>${ok === res.length ? '✓' : '✕'}</i>${ok === res.length ? 'Todo en orden' : 'Revisar'}</span></div>
        <div class="note">${res.length} pruebas en ${ms} ms</div>
        <button class="btn p" id="rerun">${I('refresh', 14)} Ejecutar de nuevo</button></div></div>
    <div class="grid" style="grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px">${GRUPOS.map(([k, n]) => { const g = res.filter(r => r.v === k), o = g.filter(r => r.ok).length; return `<a class="card tight" href="#g-${k}" style="text-decoration:none;color:inherit;border-color:${o === g.length ? 'var(--line)' : 'var(--red)'}"><div class="spread"><b style="font:700 12.5px/1.25 var(--mont);color:var(--n800)">${n}</b><span class="st ${o === g.length ? 'v' : 'r'}"><i>${o === g.length ? '✓' : '✕'}</i></span></div><div class="big" style="font-size:22px;margin-top:6px">${o}/${g.length}</div></a>`; }).join('')}</div>
    <div class="card"><table class="t tests" style="font-size:12.5px"><thead><tr><th style="width:34px"></th><th>Prueba</th><th>Esperado</th><th>Obtenido</th></tr></thead><tbody>
    ${GRUPOS.map(([k, n]) => `<tr id="g-${k}"><td colspan="4" style="background:var(--b50);font:800 13px var(--mont);color:var(--n800)">${n}</td></tr>` + res.filter(r => r.v === k).map(r => `<tr><td><span class="st ${r.ok ? 'v' : 'r'}"><i>${r.ok ? '✓' : '✕'}</i></span></td><td>${r.n}</td><td class="mono" data-l="Esperado" style="font-size:11px">${r.exp}</td><td class="mono" data-l="Obtenido" style="font-size:11px">${r.got}</td></tr>`).join('')).join('')}
    </tbody></table></div>`;
    $('#rerun', el).onclick = draw;
  };
  draw();
};

// ---------- ficha de cada vista ----------
function openFicha() {
  const k = CUR; const f = FICHAS.find(x => x.k === k); if (!f) return;
  const res = (LAST || runTests()).res.filter(r => r.v === k), ok = res.filter(r => r.ok).length;
  $('#drawer').innerHTML = `<div class="dh"><div><div class="kick">Ficha de la vista ${FICHAS.indexOf(f) + 1} de 14</div><h3>${f.n}</h3></div><button class="btn sm" id="dclose">${I('x', 14)}</button></div>
    <div class="db">
      <div class="dsec"><span>Para qué sirve</span><p>${f.para}</p></div>
      <div class="dsec"><span>Quién la usa en el fondo de hoy</span><p>${f.hoy}</p></div>
      <div class="dsec"><span>De dónde salen los datos</span><p>${f.datos}</p></div>
      <div class="dsec"><span>Mecanismo de la propuesta</span><p>${f.mec}</p></div>
      <div class="dsec"><span>Por qué es viable</span><div class="kv" style="grid-template-columns:76px 1fr;font-size:12.5px;gap:6px 10px"><span>Técnica</span><b style="font-weight:500">${f.tec}</b><span>Jurídica</span><b style="font-weight:500">${f.jur}</b><span>Costo</span><b style="font-weight:500">${f.costo}</b><span>Fecha</span><b style="font-weight:600">${f.fecha}</b></div></div>
      <div class="dsec"><span>Pruebas automáticas · ${ok} de ${res.length} aprobadas</span>${res.map(r => `<div class="row" style="gap:8px;align-items:flex-start;font-size:12.5px;margin:5px 0"><span class="st ${r.ok ? 'v' : 'r'}"><i>${r.ok ? '✓' : '✕'}</i></span><span>${r.n}</span></div>`).join('')}</div>
      <div class="dsec"><span>Prueba de aceptación con datos reales</span><p>${f.acep}</p></div>
      <div class="dsec"><span>Lo que no hace</span><p>${f.lim}</p></div>
    </div>`;
  $('#drawer').classList.add('on'); $('#veil').classList.add('on');
  $('#dclose').onclick = closeFicha;
}
function closeFicha() { $('#drawer').classList.remove('on'); $('#veil').classList.remove('on'); }

// ====================================================================
// ARRANQUE
// ====================================================================
let CUR = 'tablero';
shell();
(function () {
  const b = document.createElement('button'); b.className = 'btn'; b.id = 'fichaBtn'; b.innerHTML = I('file', 15) + '<span class="lbl">Ficha de la vista</span>'; b.type = 'button'; b.setAttribute('aria-label', 'Abrir la ficha de esta vista'); b.onclick = openFicha;
  $('.top').insertBefore(b, $('.top .pill'));
  const d = document.createElement('aside'); d.id = 'drawer'; d.className = 'drawer'; document.body.appendChild(d);
  const v = document.createElement('div'); v.id = 'veil'; v.className = 'veil'; v.onclick = closeFicha; document.body.appendChild(v);
  addEventListener('keydown', e => { if (e.key === 'Escape') closeFicha(); });
})();
const _route = route;
route = function () { closeFicha(); _route(); CUR = (location.hash || '#tablero').slice(1).split('?')[0]; if (!VIEWS[CUR]) CUR = 'tablero'; $('#fichaBtn').style.display = FICHAS.some(f => f.k === CUR) ? '' : 'none'; };


// ====================================================================
// RECORRIDO EN CUALQUIER PANTALLA: menú, anterior y siguiente, bienvenida
// ====================================================================
const ORDEN = NAV.flatMap(([, items]) => items.map(([k]) => k));
function navOpen(on) {
  document.body.classList.toggle('navopen', on);
  const b = $('#menuBtn');
  if (b) { b.setAttribute('aria-expanded', on ? 'true' : 'false'); b.setAttribute('aria-label', on ? 'Cerrar el menú de vistas' : 'Abrir el menú de vistas'); }
}
function pager(host, k) {
  const i = ORDEN.indexOf(k); if (i < 0) return;
  const prev = ORDEN[i - 1], next = ORDEN[i + 1] || ORDEN[0];
  host.innerHTML = `<nav class="pager" aria-label="Recorrido por las vistas">
    ${prev ? `<a class="pg prev" href="#${prev}">${I('chevL', 18)}<span><small>Anterior</small><b>${TITLES[prev]}</b></span></a>` : '<span class="pg ghost"></span>'}
    <span class="pgc">Vista ${i + 1} de ${ORDEN.length}</span>
    <a class="pg next" href="#${next}"><span><small>${ORDEN[i + 1] ? 'Siguiente' : 'Volver al inicio'}</small><b>${TITLES[next]}</b></span>${I('chevR', 18)}</a>
  </nav>`;
}
function wrapTables(root) {
  if (!root) return;
  $$('table', root).forEach(t => {
    const p = t.parentElement;
    if (!p || p.classList.contains('tscroll')) return;
    const w = document.createElement('div'); w.className = 'tscroll'; const r = t.rows && t.rows[0]; if (r && r.cells.length >= 4 && !t.classList.contains('tests')) w.classList.add('wide'); t.replaceWith(w); w.appendChild(t);
  });
}
function closeIntro() {
  const o = $('#intro'); if (!o) return;
  try { localStorage.setItem('sv_intro', '1'); } catch (e) {}
  o.remove(); document.body.classList.remove('introopen');
}
function intro(force) {
  let seen = false;
  try { seen = localStorage.getItem('sv_intro') === '1'; } catch (e) {}
  if ((seen && !force) || $('#intro')) return;
  const o = document.createElement('div');
  o.className = 'intro'; o.id = 'intro';
  o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true'); o.setAttribute('aria-labelledby', 'introT');
  o.innerHTML = `<div class="ibox">
    <div class="iflag"><i></i><i></i><i></i></div>
    <div class="ik">Prototipo navegable · datos ficticios</div>
    <h2 id="introT">Sistema a la Vista</h2>
    <p class="il">La plataforma que plantea la <b>Propuesta para la Gerencia del Fondo Milagro</b> para seguir cada peso de la reconstrucción: de la fuente al pago, con evidencia, reglas y control social.</p>
    <div class="iwarn">${I('info', 18)}<div><b>No es un sitio oficial ni un sistema en operación.</b> No pertenece al Fondo Milagro, a Fiducoldex ni al Gobierno nacional. Contratistas, montos, procesos, alertas y personas son inventados; solo las líneas base del tablero y los límites municipales del DANE son reales.</div></div>
    <ol class="isteps">
      <li><i>${I('menu', 18)}</i><span><b>Catorce vistas</b> en el menú, más una de pruebas automáticas. En el celular, el menú se abre con el botón de arriba a la izquierda.</span></li>
      <li><i>${I('file', 18)}</i><span><b>Ficha de la vista</b>: para qué sirve, quién la usa, por qué es viable y qué pruebas pasa.</span></li>
      <li><i>${I('chevR', 18)}</i><span><b>Anterior y siguiente</b> al final de cada vista, para recorrerlas en orden.</span></li>
    </ol>
    <div class="ibtns"><button class="btn p" id="introGo" type="button">Empezar el recorrido</button><a class="btn" href="#pruebas" id="introTests">${I('check', 16)}<span>Ver las ${TESTS.length} pruebas</span></a></div>
  </div>`;
  document.body.appendChild(o); document.body.classList.add('introopen');
  $('#introGo').onclick = () => { closeIntro(); if (CUR !== 'tablero') location.hash = 'tablero'; $('#ttl').focus && $('#ttl').focus(); };
  $('#introTests').onclick = () => closeIntro();
  o.addEventListener('click', e => { if (e.target === o) closeIntro(); });
  setTimeout(() => $('#introGo') && $('#introGo').focus(), 30);
}

// en pantallas angostas, el detalle queda debajo: se lleva la vista hasta él
const REVEAL = [['.rule', '#rdet'], ['.arch .src, .arch .core>div[data-c], .arch .usr', '#as'], ['#view tr.click', '#sc']];
document.addEventListener('click', e => {
  if (innerWidth > 900) return;
  for (const [sel, tgt] of REVEAL) {
    if (e.target.closest && e.target.closest(sel)) { setTimeout(() => { const t = $(tgt); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 40); break; }
  }
});

// ====================================================================
// ARRANQUE
// ====================================================================
(function () {
  const pg = document.createElement('div'); pg.id = 'pager'; $('#view').after(pg);
  $('#ttl').setAttribute('tabindex', '-1');
  $('#menuBtn').onclick = () => navOpen(!document.body.classList.contains('navopen'));
  $('#navveil').onclick = () => navOpen(false);
  $$('.nav a').forEach(a => { a.addEventListener('click', () => navOpen(false)); });
  const ab = document.createElement('button'); ab.className = 'about'; ab.id = 'aboutBtn'; ab.type = 'button'; ab.innerHTML = I('help', 16) + '<span>Acerca de este prototipo</span>'; $('.nav').appendChild(ab);
  ab.onclick = () => { navOpen(false); intro(true); };
  addEventListener('keydown', e => { if (e.key === 'Escape') { navOpen(false); closeIntro(); } });
  const mo = new MutationObserver(() => wrapTables($('#view')));
  mo.observe($('#view'), { childList: true, subtree: true });
  matchMedia('(min-width: 1101px)').addEventListener ? matchMedia('(min-width: 1101px)').addEventListener('change', e => { if (e.matches) navOpen(false); }) : 0;
})();
const _route2 = route;
route = function () {
  navOpen(false);
  _route2();
  $$('.nav a').forEach(a => { if (a.classList.contains('on')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  pager($('#pager'), CUR);
  document.title = `${TITLES[CUR]} · Sistema a la Vista (prototipo con datos ficticios)`;
  wrapTables($('#view'));
};
addEventListener('hashchange', route);
route();
intro(false);
setTimeout(() => { const r = runTests(); console.log('pruebas ' + r.res.filter(x => x.ok).length + '/' + r.res.length); }, 50);
</script></body></html>
